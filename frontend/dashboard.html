<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rickey Store | User Dashboard</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* මුළු පිටුවම කළු/තද නිල් කිරීමට background එක force කර ඇත */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    html, body { background-color: #0a0a14 !important; background: #0a0a14 !important; color: #fff; min-height: 100vh; }
    body { padding: 20px; }
    
    .dashboard-container { max-width: 900px; margin: 0 auto; }
    
    /* Header Styles (Dark background with subtle border) */
    header { display: flex; justify-content: space-between; align-items: center; background: #111122; padding: 15px 25px; border-radius: 12px; border: 1px solid #1f1f3a; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .logo { font-family: 'Orbitron', sans-serif; color: #007bff; font-weight: 800; font-size: 20px; text-shadow: 0 0 15px rgba(0, 123, 255, 0.6); }
    .user-info { display: flex; align-items: center; gap: 15px; }
    .user-name { font-size: 14px; font-weight: 600; color: #fff; }
    .logout-btn { background: rgba(255, 65, 108, 0.1); border: 1px solid #ff416c; color: #ff416c; padding: 8px 15px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .logout-btn:hover { background: #ff416c; color: #fff; box-shadow: 0 0 15px rgba(255, 65, 108, 0.5); }
    
    /* Dashboard Grid Layout */
    .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    /* Left Column: Wallet Balance Card (Neon Glow Effect) */
    .wallet-card { background: #111122; padding: 40px 20px; border-radius: 16px; border: 1px solid #007bff; text-align: center; box-shadow: 0 0 25px rgba(0, 123, 255, 0.25); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    .wallet-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: linear-gradient(180deg, #007bff, #00c6ff); }
    .wallet-card i { font-size: 50px; color: #00c6ff; margin-bottom: 15px; text-shadow: 0 0 20px rgba(0, 198, 255, 0.5); }
    .wallet-card h3 { font-size: 12px; color: #8f8fbc; font-weight: 600; letter-spacing: 1px; margin-bottom: 8px; }
    .balance { font-family: 'Orbitron', sans-serif; font-size: 34px; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(0, 198, 255, 0.3); }
    
    /* Right Column: Deposit Section */
    .deposit-card { background: #111122; padding: 30px; border-radius: 16px; border: 1px solid #1f1f3a; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .deposit-card h2 { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #007bff; margin-bottom: 20px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 123, 255, 0.3); }
    
    /* Instruction Box (Very Dark Blue) */
    .ezcash-instruction { background: #07070f; border: 1px dashed #00c6ff; padding: 18px; border-radius: 8px; margin-bottom: 25px; display: flex; align-items: flex-start; gap: 15px; }
    .ezcash-instruction i { font-size: 24px; color: #00c6ff; margin-top: 3px; }
    .ezcash-details p { font-size: 13px; color: #b4b4d0; font-weight: 400; line-height: 1.6; }
    .ezcash-number { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: 1px; margin-top: 15px; background: rgba(0, 198, 255, 0.1); padding: 5px 12px; border-radius: 6px; display: inline-block; border: 1px solid rgba(0, 198, 255, 0.2); }
    
    /* Form Styles */
    .form-group { margin-bottom: 20px; }
    label { font-size: 11px; color: #8f8fbc; display: block; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
    input { width: 100%; padding: 12px; background: #07070f; border: 1px solid #2a2a4a; border-radius: 8px; color: #fff; font-weight: 600; font-size: 14px; transition: 0.3s; }
    input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 10px rgba(0, 123, 255, 0.3); background: #090914; }
    
    /* Custom File Upload Button (Dark style) */
    .file-upload-wrapper { position: relative; background: #07070f; border: 1px dashed #2a2a4a; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
    .file-upload-wrapper:hover { border-color: #007bff; background: rgba(0, 123, 255, 0.04); }
    .file-upload-wrapper i { font-size: 24px; color: #4e4e75; margin-bottom: 8px; transition: 0.3s; }
    .file-upload-wrapper p { font-size: 12px; color: #8f8fbc; font-weight: 500; }
    .file-upload-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    
    .submit-btn { width: 100%; padding: 14px; background: linear-gradient(45deg, #007bff, #00c6ff); border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; transition: 0.3s; letter-spacing: 0.5px; }
    .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 5px 20px rgba(0, 123, 255, 0.5); }
    
    /* Alerts */
    .alert { padding: 12px; border-radius: 6px; font-size: 12px; font-weight: 500; text-align: center; margin-top: 15px; display: none; }
    .alert-error { background: rgba(255, 65, 108, 0.15); border: 1px solid #ff416c; color: #ff416c; }
    .alert-success { background: rgba(40, 167, 69, 0.15); border: 1px solid #28a745; color: #28a745; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- HEADER SECTION -->
    <header>
      <div class="logo">RICKEY STORE</div>
      <div class="user-info">
        <span class="user-name" id="user-email-display"><i class="fa-solid fa-user-circle" style="margin-right: 5px; color: #00c6ff;"></i> Loading...</span>
        <button class="logout-btn" id="logout-btn">LOGOUT <i class="fa-solid fa-sign-out-alt"></i></button>
      </div>
    </header>

    <!-- MAIN GRID -->
    <div class="grid">
      
      <!-- LEFT: WALLET BALANCE CARD -->
      <div class="wallet-card">
        <i class="fa-solid fa-wallet"></i>
        <h3>CURRENT WALLET BALANCE</h3>
        <div class="balance" id="wallet-balance">LKR 0.00</div>
      </div>
      
      <!-- RIGHT: EZCASH DEPOSIT FORM -->
      <div class="deposit-card">
        <h2>ADD FUNDS VIA EZ CASH</h2>
        
        <!-- EzCash Instructions -->
        <div class="ezcash-instruction">
          <i class="fa-solid fa-mobile-screen-button"></i>
          <div class="ezcash-details">
            <p>පහත සඳහන් Ez Cash අංකයට මුදල් තැන්පත් කර, එම රිසිට්පතෙහි ඡායාරූපය සහ Transaction ID එක මෙහි ඇතුළත් කරන්න.</p>
            <div class="ezcash-number">📞 Ez Cash No: <span style="color: #00c6ff;">07XXXXXXXX</span></div> <!-- ⚠️ මෙතනට ඔයාගේ EzCash No එක දාන්න මචං -->
          </div>
        </div>
        
        <!-- Deposit Form -->
        <form id="deposit-form">
          <div class="form-group">
            <label>DEPOSIT AMOUNT (LKR) *</label>
            <input type="number" id="deposit-amount" required placeholder="Eg: 500" min="10">
          </div>
          
          <div class="form-group">
            <label>TRANSACTION ID (TXN ID) *</label>
            <input type="text" id="deposit-txnid" required placeholder="Eg: 1029384756">
          </div>
          
          <div class="form-group">
            <label>UPLOAD RECEIPT PHOTO (IMAGE ONLY) *</label>
            <div class="file-upload-wrapper">
              <i class="fa-solid fa-cloud-arrow-up" id="upload-icon"></i>
              <p id="upload-text">Click or Drag & Drop your Receipt Image</p>
              <input type="file" id="deposit-file" accept="image/*" required>
            </div>
          </div>
          
          <button type="submit" class="submit-btn">SUBMIT PROOF FOR APPROVAL 🚀</button>
        </form>
        
        <!-- Status Messages -->
        <div id="status-error" class="alert alert-error"></div>
        <div id="status-success" class="alert alert-success"></div>
        
      </div>
    </div>
  </div>

  <!-- ================= FIREBASE CORE SDK & AUTH SDK ================= -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    // ⚠️ YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const errEl = document.getElementById('status-error');
    const succEl = document.getElementById('status-success');

    // 🔒 USER AUTH CHECK
    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('user-email-display').innerHTML = `<i class="fa-solid fa-user-circle" style="margin-right: 5px; color: #00c6ff;"></i> ${user.email}`;
      } else {
        window.location.href = "login.html";
      }
    });

    // 📂 FILE UPLOAD TEXT CHANGE
    document.getElementById('deposit-file').addEventListener('change', (e) => {
      const fileName = e.target.files[0] ? e.target.files[0].name : "Click or Drag & Drop your Receipt Image";
      document.getElementById('upload-text').innerText = fileName;
      document.getElementById('upload-icon').style.color = "#00c6ff";
    });

    // 📥 DEPOSIT FORM SUBMISSION
    document.getElementById('deposit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      succEl.style.display = 'block';
      succEl.innerText = "💸 Proof submitted successfully! Admin will check and approve your funds soon.";
      
      document.getElementById('deposit-form').reset();
      document.getElementById('upload-text').innerText = "Click or Drag & Drop your Receipt Image";
      document.getElementById('upload-icon').style.color = "#555";
    });

    // 🚪 LOGOUT BUTTON LOGIC
    document.getElementById('logout-btn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>
