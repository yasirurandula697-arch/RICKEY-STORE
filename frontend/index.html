<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RICKEY STORE</title>
    <!-- ඔයාගේ Store එකේ තියෙන ඒම Font එකම -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f0f1e; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { width: 90%; max-width: 380px; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .logo { font-family: 'Orbitron'; font-size: 28px; color: white; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: #1a1a2e; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
        .btn-main { background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">RICKEY<span>STORE</span></div>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button class="btn btn-main" onclick="handleLogin()">LOGIN</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDQzjYIoFl1uU0c24IkMFYKt9xsIjrlt3U",
        authDomain: "rickey-3c59e.firebaseapp.com",
        projectId: "rickey-3c59e",
        storageBucket: "rickey-3c59e.firebasestorage.app",
        messagingSenderId: "375211284684",
        appId: "1:375211284684:web:cb2faf2d708d53fe6e4a69"
    };
    firebase.initializeApp(firebaseConfig);

    function handleLogin() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        firebase.auth().signInWithEmailAndPassword(e, p)
            .then(() => { window.location.href = "store.html"; })
            .catch(err => { alert("Error: " + err.message); });
    }
</script>
</body>
</html>
