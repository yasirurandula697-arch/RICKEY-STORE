<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RANU EDITZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 10px; transition: 0.3s; }
        .btn-login { background: #007bff; color: white; }
        .btn-google { background: #fff; border: 1px solid #ddd; color: #555; margin-top: 15px; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Welcome to RANU EDITZ</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button class="btn btn-login" onclick="login()">Login</button>
    <button class="btn" onclick="register()" style="background: #e9ecef;">Register</button>
    <button class="btn btn-google" onclick="googleLogin()">Login with Google</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    const firebaseConfig = { /* ඔයාගේ Config එක මෙතනට දාන්න */ };
    firebase.initializeApp(firebaseConfig);

    function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(() => window.location.href = "store.html");
    }

    function register() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        firebase.auth().createUserWithEmailAndPassword(e, p).then(() => alert("Registered!"));
    }

    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).then(() => window.location.href = "store.html");
    }
</script>
</body>
</html>
